name: fetch
on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * 1-5"
    - cron: "20 16 * * 1-5"
    - cron: "5 19 * * 1-5"
    - cron: "13 19 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "20 17 * * 1-5"
    - cron: "5 20 * * 1-5"
    - cron: "13 20 * * 1-5"
    - cron: "30 21 * * 1-5"
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance==1.6.0 pandas numpy
      - run: python fetch.py
      - run: |
          git config user.name "trading-desk-bot"
          git config user.email "trading-desk-bot@users.noreply.github.com"
          git add data/latest.json
          git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no change"
          git pull --rebase --quiet || true
          git push
